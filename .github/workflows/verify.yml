name: Verify Proof Bundle

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run verifier (if proof exists)
        run: |
          if [ -f proof_bundle.json ]; then
            python verify_proof.py proof_bundle.json
          else
            echo "No proof_bundle.json found in repo root. Skipping verification."
          fi
